<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Online Voting System</title>
    <link href="styles/pages.css" rel="stylesheet">
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <i class="icon-vote"></i>
                </div>
                <span>VoteSecure</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <h1 class="page-title">Contact Us</h1>
            <p class="page-subtitle">We're here to help with your voting needs</p>
            
            <div class="contact-container">
                <div class="contact-info">
                    <div class="info-card">
                        <i class="icon-mail"></i>
                        <h3>Email</h3>
                        <p>support@votesecure.com</p>
                    </div>

                    <div class="info-card">
                        <i class="icon-phone"></i>
                        <h3>Phone</h3>
                        <p>+1 (555) 123-4567</p>
                    </div>

                    <div class="info-card">
                        <i class="icon-map-pin"></i>
                        <h3>Address</h3>
                        <p>123 Democracy Street<br>Capital City, DC 10001</p>
                    </div>
                </div>

                <form class="contact-form" onsubmit="return submitContact()">
                    <h2>Send Us a Message</h2>
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="subject" placeholder="What is this about?" required>
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="message" rows="5" placeholder="Your message..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2025 Online Voting System. All rights reserved.</p>
            <p class="team">Developed by Team Democracy</p>
        </div>
    </footer>

    <script>
        function submitContact() {
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            
            if (name && email) {
                alert('Thank you for contacting us! We will get back to you soon.');
                document.querySelector('.contact-form').reset();
            }
            return false;
        }
    </script>
</body>
</html>
