<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Created - Online Voting System</title>
    <link href="styles/dashboard.css" rel="stylesheet">
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i class="icon-check-circle"></i>
            </div>
            <h1>Election Created Successfully!</h1>
            <div id="electionDetails" class="election-details"></div>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                <a href="admin-dashboard.html" class="btn-primary">Back to Dashboard</a>
                <a href="create-election.html" class="btn-secondary">Create Another</a>
            </div>
        </div>
    </div>
    
    <script>
        window.onload = function() {
            var election = JSON.parse(localStorage.getItem('lastCreatedElection') || '{}');
            
            if (election.title) {
                var details = '<p style="color: var(--text-muted); margin-bottom: 1rem;">Election details:</p>';
                details += '<div style="background: var(--bg-dark); padding: 1.5rem; border-radius: 8px; text-align: left;">';
                details += '<p style="margin-bottom: 0.5rem;"><strong>Title:</strong> ' + election.title + '</p>';
                details += '<p style="margin-bottom: 0.5rem;"><strong>Description:</strong> ' + election.description + '</p>';
                details += '<p style="margin-bottom: 0.5rem;"><strong>Start Date:</strong> ' + election.startDate + '</p>';
                details += '<p><strong>End Date:</strong> ' + election.endDate + '</p>';
                details += '</div>';
                
                document.getElementById('electionDetails').innerHTML = details;
            }
        };
    </script>
</body>
</html>
