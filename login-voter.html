<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Login - Online Voting System</title>
    <link href="styles/auth.css" rel="stylesheet">
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <div class="auth-logo-icon">
                    <i class="icon-vote"></i>
                </div>
            </a>
            <h2 class="auth-title">Voter Login</h2>
            <p class="auth-subtitle">Sign in to cast your vote</p>
            
            <div id="messageBox" class="message-box" style="display: none;"></div>
            
            <form class="auth-form" onsubmit="validateLogin(); return false;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" minlength="6" required>
                </div>
                
                <button type="submit" class="btn-submit">Login</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>
    
    <script>
        function showMessage(message, type) {
            var messageBox = document.getElementById('messageBox');
            messageBox.textContent = message;
            messageBox.className = 'message-box message-' + type;
            messageBox.style.display = 'block';
            
            setTimeout(function() {
                messageBox.style.display = 'none';
            }, 5000);
        }
        
        function validateLogin() {
            var email = document.getElementById('loginEmail').value;
            var password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Please enter both email and password!', 'error');
                return false;
            }
            
            var registeredUsers = localStorage.getItem('registeredUsers');
            
            if (!registeredUsers || registeredUsers === 'null' || registeredUsers === '[]') {
                showMessage('Please register yourself first before logging in!', 'error');
                setTimeout(function() {
                    window.location.href = 'register.html';
                }, 2000);
                return false;
            }
            
            var users;
            try {
                users = JSON.parse(registeredUsers);
                if (!Array.isArray(users) || users.length === 0) {
                    showMessage('No registered users found. Please register first!', 'error');
                    setTimeout(function() {
                        window.location.href = 'register.html';
                    }, 2000);
                    return false;
                }
            } catch (e) {
                showMessage('System error. Please register first!', 'error');
                setTimeout(function() {
                    window.location.href = 'register.html';
                }, 2000);
                return false;
            }
            
            var userFound = false;
            var foundUser = null;
            
            for (var i = 0; i < users.length; i++) {
                if (users[i].email === email) {
                    if (users[i].password === password) {
                        userFound = true;
                        foundUser = users[i];
                        break;
                    } else {
                        showMessage('Incorrect password. Please try again!', 'error');
                        return false;
                    }
                }
            }
            
            if (userFound && foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                showMessage('Login successful! Welcome ' + foundUser.fullName + '!', 'success');
                setTimeout(function() {
                    window.location.href = 'voter-dashboard.html';
                }, 1500);
            } else {
                showMessage('Email not found. Please register yourself first!', 'error');
                setTimeout(function() {
                    window.location.href = 'register.html';
                }, 2000);
            }
            
            return false;
        }
    </script>
</body>
</html>
