<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Online Voting System</title>
    <link href="styles/auth.css" rel="stylesheet">
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <div class="auth-logo-icon">
                    <i class="icon-shield"></i>
                </div>
            </a>
            <h2 class="auth-title">Admin Login</h2>
            <p class="auth-subtitle">Secure administrative access</p>
            
            <form class="auth-form" onsubmit="return handleAdminLogin()">
                <div class="form-group">
                    <label>Admin Username</label>
                    <input type="text" name="username" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" name="password" placeholder="Enter admin password" minlength="6" required>
                </div>
                
                <button type="submit" class="btn-submit">Login as Admin</button>
            </form>
            
            <div class="auth-footer">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>
    
    <script>
        function handleAdminLogin() {
            var username = document.querySelector('input[name="username"]').value;
            var password = document.querySelector('input[name="password"]').value;
            
            if (!username || !password) {
                alert('Please enter both username and password!');
                return false;
            }
            
            alert('Admin login successful! Welcome ' + username);
            setTimeout(function() {
                window.location.href = 'admin-dashboard.html';
            }, 500);
            
            return false;
        }
    </script>
</body>
</html>
